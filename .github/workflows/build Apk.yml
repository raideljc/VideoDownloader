name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache ant
      - name: Verify Ant
        run: ant -version
      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3.0" "setuptools<71.0.0" buildozer
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf $HOME/.buildozer
      - name: Deshabilitar parche problemático de Python
       run: |
          # La ruta exacta donde Buildozer clona p4a
          PATCH_PATH="${{ github.workspace }}/.buildozer/android/platform/python-for-android/pythonforandroid/recipes/python3/patches/3.14_armv7l_fix.patch"
          if [ -f "$PATCH_PATH" ]; then
             mv "$PATCH_PATH" "${PATCH_PATH}.disabled"
             echo "Parche deshabilitado correctamente."
          else
             echo "El parche no existe en esta ruta, continuando..."
          fi
      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
