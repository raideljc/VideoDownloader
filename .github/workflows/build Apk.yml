name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fix apt mirror (Azure DNS outage fallback)
        run: |
           if ! getent hosts azure.archive.ubuntu.com >/dev/null 2>&1; then
              echo "azure.archive.ubuntu.com no resuelve, cambiando a mirror público"
              sudo sed -i 's|azure\.archive\.ubuntu\.com|mirrors.edge.kernel.org|g' /etc/apt/sources.list 2>/dev/null || true
              [ -f /etc/apt/sources.list.d/ubuntu.sources ] && \
                 sudo sed -i 's|azure\.archive\.ubuntu\.com|mirrors.edge.kernel.org|g' /etc/apt/sources.list.d/ubuntu.sources
              [ -f /etc/apt/apt-mirrors.txt ] && \
                 sudo sed -i 's|azure\.archive\.ubuntu\.com|mirrors.edge.kernel.org|g' /etc/apt/apt-mirrors.txt
              sudo apt-get clean
           fi
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache ant

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3.0" "setuptools<71.0.0" buildozer
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Clean previous build
        run: |
          
          rm -rf .buildozer
          rm -rf $HOME/.buildozer

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
