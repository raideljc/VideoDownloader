name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3.0" "setuptools<71.0.0" buildozer
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Configure local recipes path
       run: |
        RECIPE_PATH="$(pwd)/p4a-recipes"
        sed -i "s|^# p4a.local_recipes.*|p4a.local_recipes = $RECIPE_PATH|" buildozer.spec
    # Si no hay línea comentada, agrega
         #grep -q "^p4a.local_recipes" buildozer.spec || echo "p4a.local_recipes = $RECIPE_PATH" >> buildozer.spec
      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf $HOME/.buildozer

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
