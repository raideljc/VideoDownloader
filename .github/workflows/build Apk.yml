name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3.0" "setuptools<71.0.0" buildozer
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Patch python3 recipe to disable grp module
        run: |
         echo "PWD: $(pwd)"
         ls -la
         ls -la p4a-recipes/python3/ || echo "NO EXISTE p4a-recipes/python3/"
         P4A_RECIPE_DIR="$HOME/.buildozer/android/platform/python-for-android/pythonforandroid/recipes/python3"
         cp p4a-recipes/python3/disable-grp.patch "$P4A_RECIPE_DIR/"
         echo "patches = ['disable-grp.patch']" >> "$P4A_RECIPE_DIR/__init__.py"          

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf $HOME/.buildozer

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
